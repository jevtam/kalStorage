<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SEBIAN LEX</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <main class="app">
      <div class="app__inner">
        <header class="app__header"></header>

        <form id="task-form" class="task-form" autocomplete="off">
          <div class="task-form__fields">
            <input
              id="title"
              name="title"
              class="field"
              type="text"
              placeholder="Title…"
              required
            />
            <input
              id="note"
              name="note"
              class="field"
              type="text"
              placeholder="About…"
            />
          </div>
          <button class="btn-add" type="submit" title="Add task">
            <img src="img/addButton.png" alt="Add" />
          </button>
        </form>

        <section id="empty" class="empty">
          <p>No tasks</p>
        </section>

        <ul id="list" class="list" role="list"></ul>
      </div>
    </main>

    <dialog id="confirm" class="dialog card">
      <p class="dialog__title">Delete this task?</p>
      <div class="dialog__actions">
        <button class="btn btn--ghost" value="no">
          <img src="img/cancelButton.png" alt="" width="18" height="18" />
          <span>No</span>
        </button>
        <button class="btn btn--accent" value="yes">
          <img src="img/daButton.png" alt="" width="18" height="18" />
          <span>Yes</span>
        </button>
      </div>
    </dialog>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
